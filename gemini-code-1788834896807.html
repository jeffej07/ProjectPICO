<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICO Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0f0c;
            --card-bg: #121814;
            --accent-green: #2ee88f;
            --accent-lime: #c8f24d;
            --text-main: #ffffff;
            --text-muted: #8b9590;
            --overlay-pink: #e60067; /* Matches reference hover color */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 60px 20px;
        }

        .portfolio-section {
            max-width: 1160px;
            margin: 0 auto;
        }

        /* Section Title Styling */
        .section-header {
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Portfolio Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        @media (max-width: 900px) {
            .portfolio-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Portfolio Card Styling & Hover Animation */
        .portfolio-card {
            position: relative;
            background-color: #e5e5e5; /* Light placeholder background matching reference */
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }

        .portfolio-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hover Zoom Effect */
        .portfolio-card:hover img {
            transform: scale(1.05);
        }

        /* Sliding Overlay */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-pink);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .portfolio-card:hover .card-overlay {
            transform: translateY(0);
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-category {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
        }
    </style>
</head>
<body>

    <section class="portfolio-section">
        <div class="section-header">
            <h2>Our Latest Projects</h2>
        </div>

        <div class="portfolio-grid">
            <!-- Project 1 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="AOC Production">
                <div class="card-overlay">
                    <h3 class="card-title">AOC Production</h3>
                    <p class="card-category">Design</p>
                </div>
            </div>

            <!-- Project 2 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80" alt="Ind Hed">
                <div class="card-overlay">
                    <h3 class="card-title">Ind Hed</h3>
                    <p class="card-category">Photography</p>
                </div>
            </div>

            <!-- Project 3 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=600&q=80" alt="Paper Mockup">
                <div class="card-overlay">
                    <h3 class="card-title">Paper Mockup</h3>
                    <p class="card-category">Development</p>
                </div>
            </div>

            <!-- Project 4 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=600&q=80" alt="The Nordic">
                <div class="card-overlay">
                    <h3 class="card-title">The Nordic</h3>
                    <p class="card-category">Design</p>
                </div>
            </div>

            <!-- Project 5 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80" alt="Creatives Castle">
                <div class="card-overlay">
                    <h3 class="card-title">Creatives Castle</h3>
                    <p class="card-category">Photography</p>
                </div>
            </div>

            <!-- Project 6 -->
            <div class="portfolio-card">
                <img src="https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=600&q=80" alt="Brand Identity">
                <div class="card-overlay">
                    <h3 class="card-title">Brand Identity</h3>
                    <p class="card-category">Branding</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
