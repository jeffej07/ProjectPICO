<!DOCTYPE html>
<html lang="en" style="background:#0a0f0c;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  :root{
    /* ↓↓↓ MASTER CONTROL — CIRCLE VIDEO SIZE ↓↓↓
       Single knob for how big the circular video container is.
       1 = 100% of --circle-base-size. 1.5 = 50% bigger. 0.5 = half size.
       Edit ONLY this value to resize the circle. */
    --circle-scale: 1;

    /* Base diameter the scale above multiplies against.
       Rarely needs touching — change --circle-scale instead. */
    --circle-base-size: 220px;

    /* ↓↓↓ MASTER CONTROL — VIDEO ZOOM & POSITION ↓↓↓
       This is separate from --circle-scale above: --circle-scale
       resizes the circular window itself, these three resize/reposition
       the *video content* inside that window (useful when the subject
       in the source clip is small or off-center, like a logo that only
       occupies a corner of the frame).
       --video-zoom: 1 = no zoom. 2 = zoomed in 2x. 0.5 = zoomed out.
       --video-offset-x / --video-offset-y: nudge the video left/right
       and up/down. Positive x moves it right, positive y moves it down.
       Percentages are relative to the circle's own size. */
    /* Starting point based on your recording — the logo sat small and
       toward the upper-left of the circle, so this zooms in and nudges
       the video right/down to bring it toward center. Nudge these by
       eye in small steps (e.g. 10px at a time) until it looks right —
       I can't preview the live video from here, so this is a starting
       guess, not a measured fit.
       Offsets are in px now (not %), so they no longer scale
       automatically if you change --circle-scale — you may need to
       re-tune them if you resize the circle later. */
    --video-zoom: 4;
    --video-offset-x: -3px;
    --video-offset-y: 12px;
  }

  html,body{
    margin:0; padding:0; height:100%;
    background:#0a0f0c;
    overflow:hidden;
  }

  #intro{
    position:fixed; inset:0;
    background:#181818;
    /* starts at 200% — bigger than the viewport so it fully covers the
       screen — then collapses down to a single point at the center */
    clip-path:circle(200% at 50% 50%);
    /* ↓↓↓ CONTROLS HOW FAST THE CIRCLE COLLAPSES ↓↓↓
       This is the "closing" animation speed once it's triggered.
       Bigger number = slower close. Smaller number = faster close.
       If you change this, also update CLOSE_MS in the <script> below
       to roughly match (slightly higher) so the page doesn't navigate
       before the animation finishes. */
    transition:clip-path .9s cubic-bezier(.60,1,.15,0);
    /* sits below the video circle now, so the video stays visible
       on top while this collapses around it */
    z-index:1;
  }

  /* triggered by JS shortly after load: the circle collapses down to 0,
     revealing the main page underneath */
  #intro.closing{
    clip-path:circle(0% at 50% 50%);
  }

  /* Circular video container, centered on screen, sized by the
     --circle-scale master control above. Sits underneath #intro, so
     as the green circle collapses toward the center it converges on
     this video. */
  #video-circle{
    position:fixed;
    top:50%; left:50%;
    width: calc(var(--circle-base-size) * var(--circle-scale));
    height: calc(var(--circle-base-size) * var(--circle-scale));
    transform: translate(-50%, -50%);
    border-radius:50%;
    overflow:hidden;
    /* sits above #intro, so the video is visible on top of the green
       circle the whole time instead of being revealed by it */
    z-index:2;
    background:#000; /* shows briefly if the video hasn't painted yet */
  }

  #video-circle video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    /* offset first, then zoom, so the offset direction stays intuitive
       regardless of the zoom level */
    transform:
      translate(var(--video-offset-x), var(--video-offset-y))
      scale(var(--video-zoom));
    transform-origin: center center;
  }

  /* Full-screen fade layer used for the exit transition. Starts fully
     transparent and invisible to clicks; JS fades it in with an eased
     transition right before navigating away. */
  #fade-out{
    position:fixed; inset:0;
    background:#0a0f0c;
    opacity:0;
    pointer-events:none;
    z-index:3;
    /* ↓↓↓ CONTROLS THE EXIT FADE FEEL ↓↓↓
       Duration is set inline via JS (FADE_MS) so the two stay in sync;
       change the easing curve here if you want a different feel. */
    transition:opacity 900ms ease;
  }

  #fade-out.active{
    opacity:1;
  }
</style>
</head>
<body>

  <div id="video-circle">
    <video src="assets/Loadinglogo.mp4" autoplay muted playsinline></video>
  </div>

  <div id="intro"></div>

  <div id="fade-out"></div>

  <script>
    (function(){
      var overlay = document.getElementById('intro');
      var fadeOut = document.getElementById('fade-out');

      // ↓↓↓ CONTROLS WHEN THE CIRCLE STARTS CLOSING ↓↓↓
      // This is the delay (in milliseconds) after the page loads before
      // the circle is triggered to collapse. Raise it to hold the green
      // screen longer before it starts shrinking; lower it to trigger
      // the close sooner. 1000ms = 1 second.
      var HOLD_MS = 6000;

      // How long to wait after triggering the close before starting the
      // exit fade. Should roughly match (or slightly exceed) the
      // clip-path transition duration set on #intro in the <style> above,
      // so the collapse animation finishes before the fade begins.
      var CLOSE_MS = 950;

      // How long the exit fade takes, in ms. Keep this equal to the
      // transition duration set on #fade-out above (currently 900ms) —
      // if you change one, change both.
      var FADE_MS = 950;

      // ↓↓↓ MASTER CONTROL — MOBILE vs DESKTOP ROUTING ↓↓↓
      // Decides which page this loader sends people to once it's done.
      // A screen counts as "mobile" only if it's BOTH narrower than
      // MOBILE_BREAKPOINT_PX AND taller than it is wide (portrait) —
      // so a phone held sideways, a tablet, or any desktop/landscape
      // window still gets home.html. Raise MOBILE_BREAKPOINT_PX to
      // catch slightly wider phones as "mobile"; lower it to be more
      // strict. 430-430ish phone widths (iPhone, Pixel, etc.) are
      // comfortably under the default.
      var MOBILE_BREAKPOINT_PX = 600;

      function isMobileScreen(){
        var w = window.innerWidth;
        var h = window.innerHeight;
        return w <= MOBILE_BREAKPOINT_PX && h > w;
      }

      function goToSite(){
        // Manual override: honors the "Switch to mobile" button on
        // home.html if the visitor ends up back at the loader while
        // it's still set. TEMPORARY — remove along with the button.
        if (sessionStorage.getItem('forcedView') === 'mobile') {
          window.location.href = 'mobile.html';
          return;
        }
        // Checked right here (not just once on load) so a rotation
        // during the intro animation is still picked up correctly.
        window.location.href = isMobileScreen() ? 'mobile.html' : 'home.html';
      }

      setTimeout(function(){
        // 1) collapse the green circle
        overlay.classList.add('closing');

        setTimeout(function(){
          // 2) once the circle has finished collapsing, ease into the
          //    exit fade
          fadeOut.classList.add('active');

          setTimeout(goToSite, FADE_MS);
        }, CLOSE_MS);
      }, HOLD_MS);
    })();
  </script>

</body>
</html>
