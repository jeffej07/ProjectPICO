<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comp 10 - Lottie Animation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #lottie-container {
    width: 640px;
    height: 360px;
    background: #ffffff;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #3a3a3a;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #555;
  }
</style>
</head>
<body>

<div id="lottie-container"></div>

<div class="controls">
  <button onclick="anim.play()">Play</button>
  <button onclick="anim.pause()">Pause</button>
  <button onclick="anim.stop()">Restart</button>
  <button onclick="anim.setLoop(!anim.loop)">Toggle Loop</button>
</div>

<script>
  const animationData = {"v":"5.12.1","fr":29.9700012207031,"ip":0,"op":58.0000023623884,"w":1280,"h":720,"nm":"Comp 10","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":1,"nm":"Dark Royal Blue Solid 3","sr":1,"ks":{"o":{"a":0,"k":100,"ix":11},"r":{"a":0,"k":0,"ix":10},"p":{"a":0,"k":[608.433,344.216,0],"ix":2,"l":2},"a":{"a":0,"k":[588,334,0],"ix":1,"l":2},"s":{"a":1,"k":[{"i":{"x":[0,0,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":0,"s":[0,0,100]},{"t":14.0000005702317,"s":[100,100,100]}],"ix":6,"l":2}},"ao":0,"hasMask":true,"masksProperties":[{"inv":false,"mode":"a","pt":{"a":0,"k":{"i":[[0,0],[0,0],[0,0],[0,0]],"o":[[0,0],[0,0],[0,0],[0,0]],"v":[[688,214],[488,214],[488,450],[688,450]],"c":true},"ix":1},"o":{"a":0,"k":100,"ix":3},"x":{"a":0,"k":0,"ix":4},"nm":"Mask 1"}],"sw":1280,"sh":720,"sc":"#101215","ip":0,"op":900.000036657751,"st":0,"bm":0}],"markers":[],"props":{}};

  const anim = lottie.loadAnimation({
    container: document.getElementById('lottie-container'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    animationData: animationData
  });
</script>

</body>
</html>
