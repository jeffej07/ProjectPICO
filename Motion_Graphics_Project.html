    /* ---------- MASTER ICON COLOR CONTROL ----------
       Change these 4 lines to recolor the like/love icons EVERYWHERE.
       (Also mirrored as JS constants near the top of the <script> block
       — LIKE_ICON_COLOR etc — if you prefer editing it there instead;
       the two stay in sync automatically.) */
    --icon-like-color:#ffffff;         /* thumbs-up, not-yet-liked */
    --icon-like-active-color:#2ee88f;  /* thumbs-up, after you like it */
    --icon-love-color:#ff4d5e;         /* heart, not-yet-loved */
    --icon-love-active-color:#ff2740;  /* heart, after you love it */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    overflow:hidden; /* no vertical page scroll — the video row scrolls horizontally instead */
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%;}

  /* ---------- top bar (logo + title + back button, all in one row) ---------- */
  header{
    display:flex;align-items:center;gap:28px;
    padding:32px 0;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    flex-shrink:0; /* header keeps its height; the row below takes the rest */
  }
  .brand{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .brand img{height:36px;width:auto;display:block;}
  .brand-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap;}
  .brand-text span{color:var(--accent-a);}

  header h1{
    flex:1;min-width:200px;
    font-family:'Poppins',sans-serif;font-weight:600;
    font-size:clamp(22px,3vw,36px);line-height:1.1;letter-spacing:-.01em;
  }

  .btn-back{
    display:inline-flex;align-items:center;gap:8px;flex-shrink:0;
    color:#0a0f0c;text-decoration:none;
    font-size:14.5px;font-weight:600;
    padding:12px 22px;border:1px solid var(--accent-a);border-radius:999px;
    background:var(--accent-a);
    transition:background .25s ease,border-color .25s ease,color .25s ease,transform .25s ease;
  }
  .btn-back:hover{background:#25cf7c;border-color:#25cf7c;transform:translateY(-1px);}

  /* ---------- video row (horizontal scroll, no vertical page scroll) ----------
     Card size is controlled from ONE place: the CARD_MIN_WIDTH
     constant near the top of the <script> block below. Edit that
     number to shrink/grow every video container at once.

     Order = left to right. Newest video goes at the TOP of the
     `videos` array in the script below, so it renders as the
     LEFTMOST card; everything else shifts right. */
  .grid-outer{
    flex:1;min-height:0;overflow:hidden;
    position:relative; /* anchors the edge-hover pan controls */
  }
  .grid{
    height:100%;
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    gap:24px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 24px;
    touch-action:pan-x;
    scrollbar-color:var(--accent-a) var(--panel); /* firefox */
    scrollbar-width:thin;
  }
  .grid::-webkit-scrollbar{height:8px;}
  .grid::-webkit-scrollbar-track{background:var(--panel);}
  .grid::-webkit-scrollbar-thumb{background:var(--accent-a);border-radius:999px;}

  /* ---------- edge hover-to-pan controls ----------
     Appears only while the mouse actively hovers that edge (or, on
     touch, briefly after a tap) and auto-hides the instant you leave.
     Size, mask width, and color are all master-controlled from the
     EDGE_* constants near the top of the <script> block below —
     nothing here needs to be hand-edited. */
  .edge-nav{
    position:absolute;top:0;bottom:0;width:var(--edge-width,190px);z-index:5;
    display:flex;align-items:center;
    opacity:0;pointer-events:none; /* purely decorative (arrow + gradient wash) —
      hover/tap/double-tap are all detected on .grid-outer instead (see script),
      so this overlay can never sit on top of and swallow clicks meant for the
      like/love/eye buttons on the first or last card underneath it */
    transition:opacity .25s ease;
  }
  .edge-nav.show{opacity:1;}
  .edge-nav.right{
    right:0;justify-content:flex-end;padding-right:26px;
    background:linear-gradient(to right,
      transparent,
      rgba(var(--edge-color,46,232,143), var(--edge-opacity-near,.14)) 55%,
      rgba(var(--edge-color,46,232,143), var(--edge-opacity-far,.26)));
  }
  .edge-nav.left{
    left:0;justify-content:flex-start;padding-left:26px;
    background:linear-gradient(to left,
      transparent,
      rgba(var(--edge-color,46,232,143), var(--edge-opacity-near,.14)) 55%,
      rgba(var(--edge-color,46,232,143), var(--edge-opacity-far,.26)));
  }
  .edge-nav svg{
    width:var(--edge-arrow-size,34px);height:var(--edge-arrow-size,34px);
    filter:drop-shadow(0 0 8px rgba(var(--edge-color,46,232,143),.65));
    pointer-events:none; /* only clickable once actually visible — see .show rule below */
  }
  /* The strip itself stays pointer-events:none (so it never blocks the
     like/love/eye buttons on the first/last card underneath it), but
     the chevron icon becomes clickable the moment it's actually shown,
     so a click there jumps the row instead of falling through to the
     video card and playing it. */
  .edge-nav.show svg{pointer-events:auto;cursor:pointer;}
  .edge-nav path{
    fill:none;stroke:rgb(var(--edge-color,46,232,143));
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  }

  .v-card{
    position:relative;flex:0 0 var(--card-min,420px);
    aspect-ratio:16/9;border-radius:var(--radius);
    overflow:hidden;cursor:pointer;background:var(--panel);border:1px solid var(--line);
  }
  /* EDIT ME: per-video placeholder tint (used only when no poster image is set) — set via --t1/--t2 in the data array below */
  .v-card .grad{
    position:absolute;inset:0;
    background:linear-gradient(135deg,var(--t1,#123326),var(--t2,#0a0f0c));
    background-size:cover;background-position:center;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .v-card:hover .grad{transform:scale(1.06);}

  /* muted looping hover-preview video, crossfades over the poster/gradient */
  .v-card video.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease;}
  .v-card.has-video:hover video.preview{opacity:1;}
  .v-card.has-video:hover .grad{opacity:0;}

  .play-btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
    width:52px;height:52px;border-radius:50%;
    background:rgba(10,15,12,.55);border:1px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.22,1,.36,1),background .3s ease,opacity .3s ease;
    backdrop-filter:blur(2px);
    z-index:2;
  }
  .v-card:hover .play-btn{opacity:0;transform:translate(-50%,-50%) scale(.8);}
  .play-btn svg{width:16px;height:16px;fill:var(--text);margin-left:2px;}

  /* ---------- always-visible stats bar, sits inside the video container ---------- */
  .stats-bar{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;gap:18px;padding:12px 14px;
    background:linear-gradient(0deg,rgba(6,10,8,.85),rgba(6,10,8,.35) 70%,transparent);
    pointer-events:none; /* the bar itself is click-through; the two buttons below opt back in */
  }
  .stat{display:flex;align-items:center;gap:6px;}
  .stat svg{width:14px;height:14px;flex-shrink:0;}
  .stat .icon-eye{stroke:#fff;fill:none;stroke-width:1.6;}

  /* ---------- like (thumbs-up) + love (heart) buttons ---------- */
  .stat-btn{
    pointer-events:auto;cursor:pointer;
    background:none;border:none;padding:0;
    display:flex;align-items:center;gap:6px;
    font:inherit;
    transition:transform .15s ease;
  }
  .stat-btn:hover{transform:scale(1.1);}
  .stat-btn:active{transform:scale(.88);}

  /* Like/Love icons are your PNG artwork, drawn via CSS mask so the
     color comes from --icon-like-color / --icon-love-color (see the
     MASTER ICON COLOR CONTROL vars in :root, or the JS consts near the
     top of the script) instead of being baked into the image. */
  .icon-like,.icon-love{
    display:inline-block;width:14px;height:14px;flex-shrink:0;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    transition:background-color .2s ease,transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .icon-like{
    -webkit-mask-image:var(--like-icon-url);mask-image:var(--like-icon-url);
    background-color:var(--icon-like-color,#fff);
  }
  .stat-btn.like-btn.active .icon-like{background-color:var(--icon-like-active-color,var(--accent-a));}
  .stat-btn.like-btn.active .stat-num{color:var(--icon-like-active-color,var(--accent-a));}

  .icon-love{
    -webkit-mask-image:var(--love-icon-url);mask-image:var(--love-icon-url);
    background-color:var(--icon-love-color,var(--heart-red));
  }
  .stat-btn.love-btn.active .icon-love{background-color:var(--icon-love-active-color,var(--heart-red));transform:scale(1.22);}

  .stat-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;transition:color .2s ease;}

  /* ---------- click-to-play modal ---------- */
  .player-modal{
    position:fixed;inset:0;background:rgba(5,8,6,.92);
    display:none;align-items:center;justify-content:center;
    padding:32px;z-index:100;
  }
  .player-modal.open{display:flex;}
  .player-modal-inner{position:relative;max-width:920px;width:100%;}
  .player-modal-inner video{width:100%;max-height:80vh;border-radius:8px;background:#000;display:block;}
  .player-close{
    position:absolute;top:-44px;right:0;
    background:none;border:none;color:var(--text);font-size:26px;line-height:1;
    cursor:pointer;padding:6px;
  }
  .player-close:hover{color:var(--accent-a);}

  @media(max-width:600px){
    header{flex-direction:column;align-items:flex-start;gap:16px;padding:20px 0;}
    header h1{font-size:22px;}
  }
</style>
</head>

  <div class="edge-nav right" id="edge-right" aria-label="Scroll right">
    <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/><path d="M5 4l8 8-8 8"/></svg>

</div>

<script>
  // ------------------------------------------------------------------
  // EDIT ME: this is the only place you need to touch to add, remove,
  // or update a video. The row scrolls horizontally, newest on the
  // LEFT — to add a new video, paste it as the FIRST object in this
  // list (top of the array). Everything else shifts right automatically.
  //
  // All paths below are relative to this HTML file, so it expects a
  // "media" folder sitting right next to it (i.e. copy the contents
  // of C:\Users\JEFF PC\Desktop\ProjectPico\media into a "media"
  // folder alongside video-reel.html before opening it).
  //
  // videoSrc     : leave empty ("") to show a plain color placeholder;
  //                fill in a file path (e.g. "media/reel-1.mp4") to
  //                get a click-to-play video. This is the FULL clip
  //                that opens in the modal player.
  // videoSrcWebm : optional — a .webm version of videoSrc, used as a
  //                fallback for browsers that can't play the mp4.
  // previewSrc   : optional — a separate, usually shorter/lighter
  //                clip used for the muted hover-loop on the
  //                thumbnail. If omitted, videoSrc is reused for the
  //                hover preview too.
  // previewSrcWebm : optional .webm fallback for previewSrc.
  // poster       : optional still image shown before hover (e.g.
  //                "media/reel-1-poster.jpg"). If left empty, the
  //                tint1/tint2 gradient is used instead.
  // views / likes / loves : plain numbers — shown directly on the
  //                thumbnail, no hover needed.
  // ------------------------------------------------------------------
  const videos = [
    {
      title: "G2G Bet — Daily Bible Verse",
      videoSrc: "media/sample-video.mp4",
      videoSrcWebm: "media/sample-video.webm",
      poster: "media/sample-video-poster.jpg",
      tint1: "#123326", tint2: "#0a0f0c",
      views: 18700, likes: 1240, loves: 512
    },
    {
      title: "G2G Bet x 마른형님 Collab",
      videoSrc: "media/V2.mp4",
      previewSrc: "media/V2-preview.mp4",
      poster: "media/v2-thumbnail.jpg",
      tint1: "#4b2ea8", tint2: "#0a0f0c",
      views: 12400, likes: 892, loves: 340
    },
    {
      title: "G2G Bet — Daily Bible Verse II",
      videoSrc: "media/v3.mp4",
      previewSrc: "media/v3-preview.mp4",
      poster: "media/v3-thumbnail.jpg",
      tint1: "#7b1fa2", tint2: "#0a0f0c",
      views: 8600, likes: 511, loves: 198
    },
    {
      // NOTE: no full-length "v4.mp4" was supplied yet, so this card's
      // click-to-play currently reuses the short preview clip. Once
      // you have the full version, just change videoSrc below to
      // "media/v4.mp4".
      title: "Arsenal v Bayern — Betting Preview",
      videoSrc: "media/v4-preview.mp4",
      previewSrc: "media/v4-preview.mp4",
      poster: "media/v4-thumbnail.jpg",
      tint1: "#0d1b34", tint2: "#0a0f0c",
      views: 21900, likes: 1720, loves: 940
    },
    {
      title: "G2G Bet x Habanero",
      videoSrc: "media/v5.mp4",
      previewSrc: "media/v5-preview.mp4",
      poster: "media/v5-thumbnail.jpg",
      tint1: "#8a3d12", tint2: "#0a0f0c",
      views: 5300, likes: 244, loves: 91
    },
    {
      title: "G2G Bet x NetEnt",
      videoSrc: "media/v6.mp4",
      previewSrc: "media/v6-preview.mp4",
      poster: "media/v6-thumbnail.jpg",
      tint1: "#241b4d", tint2: "#0a0f0c",
      views: 9100, likes: 402, loves: 176
    }
  ];

  // ------------------------------------------------------------------
  // MASTER SIZE CONTROL — edit this one number to resize EVERY video
  // container at once. It's the minimum width (in px) each card is
  // allowed to shrink to before the grid drops to fewer columns.
  // Bigger number = bigger thumbnails (and fewer per row).
  //   420  → current screenshot look (3 per row on a normal screen)
  //   320  → smaller, more compact cards
  //   520+ → very large cards, likely 2 per row
  // ------------------------------------------------------------------
  const CARD_MIN_WIDTH = 1120;
  document.documentElement.style.setProperty('--card-min', CARD_MIN_WIDTH + 'px');

  // ------------------------------------------------------------------
  // EDGE PAN CONTROLS — master settings for the hover-to-scroll arrows
  // on the left/right edges. Edit these numbers, nothing else, to
  // restyle or retune them everywhere at once.
  // ------------------------------------------------------------------
  const EDGE_ZONE_WIDTH   = 190;        // px — width of the hoverable strip AND the gradient wash
  const EDGE_ARROW_SIZE   = 100;         // px — chevron icon size
  const EDGE_COLOR        = '46,232,143'; // "r,g,b" — drives the arrow, glow, and gradient tint
  const EDGE_OPACITY_NEAR = 0;       // gradient opacity where the wash starts fading in
  const EDGE_OPACITY_FAR  = 0;       // gradient opacity right at the screen edge
  const AUTO_SCROLL_SPEED = 1180;        // px/second — hover-and-hold pan speed
  const JUMP_SPACES       = 1;          // "double space" — how many card-widths a double-click/double-tap jumps

  document.documentElement.style.setProperty('--edge-width', EDGE_ZONE_WIDTH + 'px');
  document.documentElement.style.setProperty('--edge-arrow-size', EDGE_ARROW_SIZE + 'px');
  document.documentElement.style.setProperty('--edge-color', EDGE_COLOR);
  document.documentElement.style.setProperty('--edge-opacity-near', EDGE_OPACITY_NEAR);
  document.documentElement.style.setProperty('--edge-opacity-far', EDGE_OPACITY_FAR);

  // ------------------------------------------------------------------
  // ICON COLOR MASTER CONTROL — edit these 4 lines to recolor the
  // like (thumbs-up) and love (heart) icons everywhere at once, for
  // both their normal and "already clicked" states. (These mirror the
  // --icon-*-color CSS variables in :root — editing either place keeps
  // both in sync, so use whichever you find easier.)
  // ------------------------------------------------------------------
  const LIKE_ICON_COLOR        = '#ffffff';  // thumbs-up before you like it
  const LIKE_ICON_ACTIVE_COLOR = '#2ee88f';  // thumbs-up after you like it
  const LOVE_ICON_COLOR        = '#ff4d5e';  // heart before you love it
  const LOVE_ICON_ACTIVE_COLOR = '#ff2740';  // heart after you love it

  document.documentElement.style.setProperty('--icon-like-color', LIKE_ICON_COLOR);
  document.documentElement.style.setProperty('--icon-like-active-color', LIKE_ICON_ACTIVE_COLOR);
  document.documentElement.style.setProperty('--icon-love-color', LOVE_ICON_COLOR);
  document.documentElement.style.setProperty('--icon-love-active-color', LOVE_ICON_ACTIVE_COLOR);

  const grid = document.getElementById('grid');
  const fmt = n => n.toLocaleString('en-US');

  const iconEye  = `<svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  // Like/Love are now your uploaded PNGs (drawn as CSS-masked <span>s so
  // MASTER ICON COLOR CONTROL can recolor them) instead of the old
  // placeholder SVG shapes.
  const iconLike = `<span class="icon-like" aria-hidden="true"></span>`;
  const iconLove = `<span class="icon-love" aria-hidden="true"></span>`;

  const modal = document.getElementById('player-modal');
  const modalVideo = document.getElementById('player-video');
  const modalClose = document.getElementById('player-close');

  function sourceTags(src, webmSrc){
    let tags = `<source src="${src}" type="video/mp4">`;
    if(webmSrc) tags += `<source src="${webmSrc}" type="video/webm">`;
    return tags;
  }

  function openPlayer(v){
    modalVideo.innerHTML = sourceTags(v.videoSrc, v.videoSrcWebm);
    modal.classList.add('open');
    modalVideo.load();
    // play() returns a promise — if the file 404s or autoplay is
    // blocked, catch it instead of letting it fail silently.
    const playPromise = modalVideo.play();
    if(playPromise && playPromise.catch){
      playPromise.catch(err => console.warn(`Could not play "${v.title}": ${err.message}. Check that the file path "${v.videoSrc}" actually exists.`));
    }
  }
  function closePlayer(){
    modal.classList.remove('open');
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.innerHTML = '';
    modalVideo.load();
  }
  modalClose.addEventListener('click', closePlayer);
  modal.addEventListener('click', e => { if(e.target === modal) closePlayer(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });

  // ------------------------------------------------------------------
  // LIKE / LOVE persistence — remembers which videos *this browser*
  // has liked/loved (localStorage) so the count and the button's
  // active state survive a page refresh. Counts are client-side only
  // (there's no backend here), so they reflect this visitor's own
  // engagement layered on top of the starting numbers in the `videos`
  // array above — they won't sync across different visitors/devices.
  // ------------------------------------------------------------------
  const ENGAGEMENT_KEY = 'pico-engagement';
  function slugify(str){
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }
  function loadEngagement(){
    try { return JSON.parse(localStorage.getItem(ENGAGEMENT_KEY)) || {}; }
    catch { return {}; }
  }
  function saveEngagement(state){
    try { localStorage.setItem(ENGAGEMENT_KEY, JSON.stringify(state)); }
    catch { /* storage unavailable (private browsing, etc.) — fail quietly */ }
  }
  const engagement = loadEngagement();

  videos.forEach((v, i) => {
    const card = document.createElement('div');
    const hasVideo = !!v.videoSrc;
    const id = slugify(v.title) || `video-${i}`;
    const state = engagement[id] || { liked:false, loved:false };

    card.className = 'v-card' + (hasVideo ? ' has-video' : '');
    card.title = v.title;
    card.setAttribute('aria-label', v.title);
    card.style.setProperty('--t1', v.tint1);
    card.style.setProperty('--t2', v.tint2);

    const gradStyle = v.poster ? `background-image:url('${v.poster}');` : '';
    const likeCount = v.likes + (state.liked ? 1 : 0);
    const loveCount = v.loves + (state.loved ? 1 : 0);

    card.innerHTML = `
      <div class="grad" style="${gradStyle}"></div>
      ${hasVideo ? `<video class="preview" muted loop playsinline preload="metadata">${sourceTags(v.previewSrc || v.videoSrc, v.previewSrcWebm || v.videoSrcWebm)}</video>` : ''}
      <div class="play-btn"><svg viewBox="0 0 16 16"><path d="M2 1l13 7-13 7z"/></svg></div>
      <div class="stats-bar">
        <div class="stat">${iconEye}<span class="stat-num">${fmt(v.views)}</span></div>
        <button type="button" class="stat-btn like-btn${state.liked ? ' active' : ''}" aria-pressed="${state.liked}" aria-label="Like this video">${iconLike}<span class="stat-num">${fmt(likeCount)}</span></button>
        <button type="button" class="stat-btn love-btn${state.loved ? ' active' : ''}" aria-pressed="${state.loved}" aria-label="Love this video">${iconLove}<span class="stat-num">${fmt(loveCount)}</span></button>
      </div>
    `;

    if(hasVideo){
      const previewVid = card.querySelector('video.preview');

      // Flag a missing/broken file loudly in the console instead of
      // just having the hover preview silently never appear.
      previewVid.addEventListener('error', () => {
        console.warn(`Preview for "${v.title}" failed to load. Check that "${v.previewSrc || v.videoSrc}" exists relative to this HTML file.`);
      });

      card.addEventListener('mouseenter', () => {
        const p = previewVid.play();
        if(p && p.catch) p.catch(() => {}); // ignore benign interrupted-play errors
      });
      card.addEventListener('mouseleave', () => { previewVid.pause(); previewVid.currentTime = 0; });
      card.addEventListener('click', () => openPlayer(v));
    }

    // ---- like / love buttons: exactly ONE +1 per user, persisted per-browser ----
    // This is a toggle, not a counter you can spam: each click flips this
    // visitor's own liked/loved flag for this video between true/false, so
    // the displayed count is always "starting count + (0 or 1)" — never
    // more than +1, no matter how many times the button is clicked. Click
    // again to remove your +1. State is per-browser (localStorage), so it
    // won't sync across different visitors/devices without a real backend.
    function wireToggle(selector, key, baseCount){
      const btn = card.querySelector(selector);
      const numEl = btn.querySelector('.stat-num');
      btn.addEventListener('click', (e) => {
        e.stopPropagation(); // don't let the click bubble up and open the video modal
        const isActive = btn.classList.toggle('active'); // flips true/false, never accumulates
        btn.setAttribute('aria-pressed', String(isActive));
        numEl.textContent = fmt(baseCount + (isActive ? 1 : 0)); // always base + 0 or 1
        const current = loadEngagement();
        current[id] = current[id] || {};
        current[id][key] = isActive;
        saveEngagement(current);
      });
    }
    wireToggle('.like-btn', 'liked', v.likes);
    wireToggle('.love-btn', 'loved', v.loves);

    grid.appendChild(card);
  });

  // ---- let a normal mouse wheel scroll the row horizontally too ----
  // (trackpads and touchscreens already scroll it sideways natively;
  // this just makes a plain vertical wheel work the same way, since
  // the page itself no longer scrolls up/down.) Bound to grid-outer
  // so it also works while hovering the edge-nav arrows.
  const gridOuter = document.querySelector('.grid-outer');
  gridOuter.addEventListener('wheel', (e) => {
    if(e.deltaY === 0) return; // already a horizontal gesture, let it through natively
    e.preventDefault();
    grid.scrollLeft += e.deltaY;
  }, { passive:false });

  // ------------------------------------------------------------------
  // EDGE HOVER-TO-PAN — hover the left/right strip and the arrow +
  // gradient fade in and the row auto-scrolls for as long as the
  // mouse stays there; move away and it fades out and stops
  // immediately. Double-click (desktop) or double-tap (touch) on
  // either strip jumps a fixed distance for fast navigation.
  //
  // All of this is detected by mouse/touch COORDINATES on grid-outer
  // itself (getZone below), not by listeners on the edge-nav strips.
  // The strips are decorative only (see .edge-nav's pointer-events:none
  // above) — this is what fixes the like/love/eye buttons on the first
  // and last card being unclickable whenever they happened to sit
  // underneath the (previously interactive) 190px-wide hover zone.
  // ------------------------------------------------------------------
  const edgeLeft = document.getElementById('edge-left');
  const edgeRight = document.getElementById('edge-right');
  const edgeLeftArrow = edgeLeft.querySelector('svg');
  const edgeRightArrow = edgeRight.querySelector('svg');

  function getZone(clientX){
    const rect = gridOuter.getBoundingClientRect();
    const x = clientX - rect.left;
    if(x < EDGE_ZONE_WIDTH) return 'left';
    if(x > rect.width - EDGE_ZONE_WIDTH) return 'right';
    return null;
  }

  // Tracks whether there's actually more row to reveal in each
  // direction, so the arrows never invite hovering/tapping into a
  // dead end. Recomputed on every scroll and on resize.
  const hasMore = { left:false, right:false };
  function updateEdgeAvailability(){
    const maxScroll = grid.scrollWidth - grid.clientWidth;
    hasMore.left = grid.scrollLeft > 4;
    hasMore.right = grid.scrollLeft < maxScroll - 4;
    if(!hasMore.left) edgeLeft.classList.remove('show');
    if(!hasMore.right) edgeRight.classList.remove('show');
  }
  grid.addEventListener('scroll', updateEdgeAvailability);
  window.addEventListener('resize', updateEdgeAvailability);
  updateEdgeAvailability();

  // ---- continuous hover-and-hold auto-scroll ----
  let autoScrollDir = 0;   // -1 left, 0 idle, 1 right
  let autoScrollRAF = null;
  let lastTs = null;

  function autoScrollStep(ts){
    if(lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(autoScrollDir !== 0){
      grid.scrollLeft += autoScrollDir * AUTO_SCROLL_SPEED * dt;
      autoScrollRAF = requestAnimationFrame(autoScrollStep);
    } else {
      autoScrollRAF = null;
      lastTs = null;
    }
  }
  function startAutoScroll(dir){
    autoScrollDir = dir;
    if(!autoScrollRAF) autoScrollRAF = requestAnimationFrame(autoScrollStep);
  }
  function stopAutoScroll(){
    autoScrollDir = 0;
  }

  // ---- mouse: hover near either edge (anywhere over grid-outer, cards
  // included) reveals that side's arrow and starts panning; move away
  // from the zone and it stops. Because this is one listener on the
  // container instead of two on the strips, it never blocks a click on
  // whatever is actually under the cursor. ----
  function updateHoverZone(zone){
    if(zone === 'left' && hasMore.left){
      edgeLeft.classList.add('show');
      startAutoScroll(-1);
    } else {
      edgeLeft.classList.remove('show');
      if(autoScrollDir === -1) stopAutoScroll();
    }
    if(zone === 'right' && hasMore.right){
      edgeRight.classList.add('show');
      startAutoScroll(1);
    } else {
      edgeRight.classList.remove('show');
      if(autoScrollDir === 1) stopAutoScroll();
    }
  }
  gridOuter.addEventListener('mousemove', (e) => updateHoverZone(getZone(e.clientX)));
  gridOuter.addEventListener('mouseleave', () => updateHoverZone(null));

  // ---- touch: brief reveal on tap near an edge, since there's no hover ----
  function revealBriefly(el, dir){
    if(dir === 1 && !hasMore.right) return;
    if(dir === -1 && !hasMore.left) return;
    el.classList.add('show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('show'), 1400);
  }
  gridOuter.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if(!t) return;
    const zone = getZone(t.clientX);
    if(zone === 'left') revealBriefly(edgeLeft, -1);
    else if(zone === 'right') revealBriefly(edgeRight, 1);
  }, { passive:true });

  // ---- double-click / double-tap near an edge = fast jump ("double space") ----
  function jump(dir){
    const spaceWidth = CARD_MIN_WIDTH + 24; // 24 = the grid's gap between cards
    grid.scrollBy({ left: dir * spaceWidth * JUMP_SPACES, behavior:'smooth' });
  }
  // ---- clicking the visible arrow icon itself jumps immediately,
  // instead of the click falling through to the video card underneath
  // and playing it. ----
  edgeLeftArrow.addEventListener('click', (e) => { e.stopPropagation(); jump(-1); });
  edgeRightArrow.addEventListener('click', (e) => { e.stopPropagation(); jump(1); });

  gridOuter.addEventListener('dblclick', (e) => {
    const zone = getZone(e.clientX);
    if(zone === 'left') jump(-1);
    else if(zone === 'right') jump(1);
  });

  // Manual double-tap detection as a fallback for touch browsers that
  // don't synthesize a dblclick from two quick taps.
  const lastTap = { left:0, right:0 };
  function handleDoubleTap(zone, dir){
    const now = Date.now();
    if(now - lastTap[zone] < 350){
      jump(dir);
      lastTap[zone] = 0;
    } else {
      lastTap[zone] = now;
    }
  }
  gridOuter.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    if(!t) return;
    const zone = getZone(t.clientX);
    if(zone === 'left') handleDoubleTap('left', -1);
    else if(zone === 'right') handleDoubleTap('right', 1);
  });
</script>
