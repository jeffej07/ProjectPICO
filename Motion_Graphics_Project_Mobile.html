       the footer) — so there's no separate "header-to-feed" value to
       juggle, just these two. */

    /* ---------- MASTER ICON COLOR CONTROL ----------
       Change these 4 lines to recolor the like/love icons EVERYWHERE.
       (Also mirrored as JS constants near the top of the <script> block
       — LIKE_ICON_COLOR etc — if you prefer editing it there instead;
       the two stay in sync automatically.) */
    --icon-like-color:#ffffff;         /* thumbs-up, not-yet-liked */
    --icon-like-active-color:#2ee88f;  /* thumbs-up, after you like it */
    --icon-love-color:#ff4d5e;         /* heart, not-yet-loved */
    --icon-love-active-color:#ff2740;  /* heart, after you love it */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    min-height:100%;
    overscroll-behavior-y:contain;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* ---------- top bar — sits in normal flow, scrolls away with the page ---------- */
  header{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:calc(var(--space-header-y) + env(safe-area-inset-top)) var(--space-header-x) var(--space-header-y);
    background:rgba(10,15,12,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:26px;width:auto;display:block;}
  .brand-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;}
  .brand-text span{color:var(--accent-a);}

  .btn-back{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    color:var(--text);text-decoration:none;
    font-size:13px;font-weight:600;
    padding:8px 14px;border:1px solid rgba(255,255,255,.28);border-radius:999px;
    background:rgba(46,232,143,.08);backdrop-filter:blur(6px);
    transition:background .25s ease,border-color .25s ease,transform .25s ease;
  }
  .btn-back:active{transform:scale(.94);background:rgba(46,232,143,.18);}

  /* ---------- gallery — a normal scrolling column of video cards ---------- */
  .feed{
    flex:3;
    display:flex;flex-direction:column;align-items:stretch;
    padding:0 var(--space-feed-x);
  }

  /* each row gets its OWN top/bottom space — see --space-card-top and
     --space-card-bottom above — instead of one shared gap. Margins on
     flex children don't collapse, so two adjacent cards' top+bottom
     margins add together rather than overlapping. */
  .v-row{
    display:flex;width:100%;
    margin-top:var(--space-card-top);
    margin-bottom:var(--space-card-bottom);
  }
  .v-row.align-left{justify-content:flex-start;}
  .v-row.align-right{justify-content:flex-end;}

  .v-item{
    position:relative;
    width:min(360px,84vw);
    aspect-ratio:4/5;
    border-radius:20px;
    overflow:hidden;background:#000;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }

  .v-item .grad{
    position:absolute;inset:0;
    background:linear-gradient(135deg,var(--t1,#123326),var(--t2,#0a0f0c));
    background-size:cover;background-position:center;
  }

  /* ---------- thumbnail layer: shown until the clip is playing, with a
     gentle scroll-linked drift (see the parallax script below) ---------- */
  .v-thumb{
    position:absolute;inset:0;z-index:0;overflow:hidden;
    opacity:1;transition:opacity .35s ease;
  }
  .v-item:not(.paused) .v-thumb{opacity:0;pointer-events:none;}
  .v-thumb img{
    position:absolute;left:0;top:-15%;
    width:100%;height:130%;
    object-fit:cover;display:block;
    will-change:transform;
    transform:translateY(0);
  }

  /* object-fit:contain + a black backdrop means every clip is shown in
     full — letterboxed if its ratio doesn't match the card — instead of
     being zoomed/cropped to fill the frame. Kept transparent (opacity 0)
     until the clip is actually playing, otherwise the video element's
     own black box sits on top of and hides the .v-thumb image below it. */
  .v-item video{
    position:relative;z-index:1;width:100%;height:100%;
    object-fit:contain;
    background:#000;
    opacity:0;transition:opacity .25s ease;
  }
  .v-item:not(.paused) video{opacity:1;}

  /* subtle top-to-bottom + bottom-to-top wash so the overlay text/controls
     stay legible over any footage */
  .v-item::before{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,7,5,.4) 0,transparent 20%,transparent 60%,rgba(4,7,5,.75) 100%);
  }

  .play-btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
    width:56px;height:56px;border-radius:50%;z-index:3;
    background:rgba(10,15,12,.55);border:1px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .2s ease,transform .2s cubic-bezier(.22,1,.36,1);
    backdrop-filter:blur(2px);pointer-events:none;
  }
  .v-item.paused .play-btn{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .play-btn svg{width:20px;height:20px;fill:var(--text);margin-left:3px;}

  /* burst heart shown on a double-tap "love" — purely decorative, never
     intercepts touches, fades out on its own */
  .burst-heart{
    position:absolute;left:50%;top:50%;z-index:4;
    width:96px;height:96px;transform:translate(-50%,-50%) scale(.4);
    -webkit-mask-image:var(--love-icon-url);mask-image:var(--love-icon-url);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    background-color:var(--icon-love-active-color,var(--heart-red));
    opacity:0;pointer-events:none;
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));
  }
  .burst-heart.play{animation:heartBurst .75s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes heartBurst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    32%{transform:translate(-50%,-50%) scale(.96);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05);}
  }

  /* ---------- bottom info: view count only, left-aligned ---------- */
  /* (the title used to live here too — it's now the full-bleed marquee
     strip below the card instead; see .title-marquee) */
  .v-info{
    position:absolute;left:0;right:88px;bottom:0;z-index:2;
    padding:0 16px calc(22px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .v-views{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;}
  .v-views svg{width:14px;height:14px;flex-shrink:0;stroke:var(--text-dim);fill:none;stroke-width:1.6;}
  .v-views .stat-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;}

  /* ---------- right-hand action rail: mute + like + love ---------- */
  .v-actions{
    position:absolute;right:12px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:22px;
  }
  .action-btn{
    pointer-events:auto;cursor:pointer;
    background:none;border:none;padding:0;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font:inherit;color:var(--text);
    transition:transform .15s ease;
  }
  .action-btn:active{transform:scale(.86);}
  .action-circle{
    width:46px;height:46px;border-radius:50%;
    background:rgba(18,26,21,.55);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
  }
  .action-btn .stat-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;}

  .icon-mute{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-mute .wave{transition:opacity .15s ease;}
  .action-btn.muted .icon-mute .wave{opacity:0;}

  .icon-like,.icon-love{
    display:inline-block;width:19px;height:19px;flex-shrink:0;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    transition:background-color .2s ease,transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .icon-like{
    -webkit-mask-image:var(--like-icon-url);mask-image:var(--like-icon-url);
    background-color:var(--icon-like-color,#fff);
  }
  .action-btn.like-btn.active .icon-like{background-color:var(--icon-like-active-color,var(--accent-a));}
  .action-btn.like-btn.active .stat-num{color:var(--icon-like-active-color,var(--accent-a));}

  .icon-love{
    -webkit-mask-image:var(--love-icon-url);mask-image:var(--love-icon-url);
    background-color:var(--icon-love-color,var(--heart-red));
  }
  .action-btn.love-btn.active .icon-love{background-color:var(--icon-love-active-color,var(--heart-red));transform:scale(1.2);}
  .action-btn.love-btn.active .stat-num{color:var(--icon-love-active-color,var(--heart-red));}

  /* ---------- scrolling title strip under each video ----------
     Full-bleed (edge-to-edge of the screen, ignoring .feed's own
     side padding) via the classic width:100vw + negative-margin
     trick. Two identical copies of the repeated title sit side by
     side in .title-marquee-track; the JS below just slides that
     track back and forth by half its width and wraps the position,
     so the loop never visibly "jumps". */
  .title-marquee{
    width:100vw;
    margin-left:calc(50% - 50vw);
    overflow:hidden;
    white-space:nowrap;
    padding:var(--marquee-y) 0;
    pointer-events:none;
    -webkit-user-select:none;user-select:none;
  }
  .title-marquee-track{
    display:inline-flex;
    will-change:transform;
  }
  .title-marquee-track span{
    font-family:'Poppins',sans-serif;font-weight:700;
    font-size:var(--marquee-size);line-height:1;
    color:var(--text);white-space:nowrap;flex-shrink:0;
  }
  /* the last video's strip sits right above the footer, so it gets
     extra breathing room on top of --marquee-y that every strip has */
  .title-marquee:last-of-type{
    padding-bottom:calc(var(--marquee-y) + var(--marquee-footer-gap));
  }

  /* ---------- footer ---------- */
  footer{
    text-align:center;
    padding:var(--space-footer-y) var(--space-footer-x) calc(var(--space-footer-y) + env(safe-area-inset-bottom));
    color:var(--text-dim);font-size:12.5px;
    border-top:1px solid var(--line);
  }
</style>
</head>

  (function(){
    var MOBILE_BREAKPOINT_PX = 600; // keep this in sync across pages
    var IS_MOBILE_PAGE = true;
    var DESKTOP_URL = 'Motion_Graphics_Project.html';
    var MOBILE_URL = 'Motion_Graphics_Project_Mobile.html';

    function isMobileScreen(){
      var w = window.innerWidth, h = window.innerHeight;
      return w <= MOBILE_BREAKPOINT_PX && h > w;
    }

    var switching = false;
    function checkAndSwitch(){
      if (switching) return;
      if (isMobileScreen() !== IS_MOBILE_PAGE) {
        switching = true;
        window.location.href = isMobileScreen() ? MOBILE_URL : DESKTOP_URL;
      }
    }

    // Primary: react right away to resize/rotate/orientation events.
    var resizeTimer = null;
    function scheduleCheck(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(checkAndSwitch, 250);
    }
    window.addEventListener('resize', scheduleCheck);
    window.addEventListener('orientationchange', scheduleCheck);
    if (window.matchMedia) {
      var orientationQuery = window.matchMedia('(orientation: portrait)');
      if (orientationQuery.addEventListener) orientationQuery.addEventListener('change', scheduleCheck);
      else if (orientationQuery.addListener) orientationQuery.addListener(scheduleCheck); // older Safari
    }

    // Fail-safe: some browsers and DevTools device-emulation "rotate"
    // animations don't reliably fire a resize event every time, which
    // is what let this get stuck before. Polling is cheap and
    // guarantees the page can never get stranded on the wrong layout.
    setInterval(checkAndSwitch, 600);
  })();
</script>

<script>
  // ------------------------------------------------------------------
  // EDIT ME: this is the only place you need to touch to add, remove,
  // or update a video. Newest goes at the TOP of this list — it becomes
  // the FIRST card someone swipes into. Everything else shifts down.
  //
  // All paths below are relative to this HTML file, so it expects a
  // "media" folder sitting right next to it.
  //
  // videoSrc     : the full clip that plays inline, fullscreen, in the feed.
  // videoSrcWebm : optional .webm fallback for browsers that can't play mp4.
  // poster       : optional still shown before the video has started playing.
  //                If left empty, the tint1/tint2 gradient is used instead.
  // views / likes / loves : plain numbers shown on the overlay.
  // ------------------------------------------------------------------
  const videos = [
    {
      title: "G2G Bet — Daily Bible Verse",
      videoSrc: "media/sample-video.mp4",
      videoSrcWebm: "media/sample-video.webm",
      poster: "media/sample-video-poster.jpg",
      tint1: "#123326", tint2: "#0a0f0c",
      views: 18700, likes: 1240, loves: 512
    },
    {
      title: "G2G Bet x 마른형님 Collab",
      videoSrc: "media/V2.mp4",
      poster: "media/v2-thumbnail.jpg",
      tint1: "#4b2ea8", tint2: "#0a0f0c",
      views: 12400, likes: 892, loves: 340
    },
    {
      title: "G2G Bet — Daily Bible Verse II",
      videoSrc: "media/v3.mp4",
      poster: "media/v3-thumbnail.jpg",
      tint1: "#7b1fa2", tint2: "#0a0f0c",
      views: 8600, likes: 511, loves: 198
    },
    {
      title: "Arsenal v Bayern — Betting Preview",
      videoSrc: "media/v4-preview.mp4",
      poster: "media/v4-thumbnail.jpg",
      tint1: "#0d1b34", tint2: "#0a0f0c",
      views: 21900, likes: 1720, loves: 940
    },
    {
      title: "G2G Bet x Habanero",
      videoSrc: "media/v5.mp4",
      poster: "media/v5-thumbnail.jpg",
      tint1: "#8a3d12", tint2: "#0a0f0c",
      views: 5300, likes: 244, loves: 91
    },
    {
      title: "G2G Bet x NetEnt",
      videoSrc: "media/v6.mp4",
      poster: "media/v6-thumbnail.jpg",
      tint1: "#241b4d", tint2: "#0a0f0c",
      views: 9100, likes: 402, loves: 176
    }
  ];


  // ------------------------------------------------------------------
  // ICON COLOR MASTER CONTROL — edit these 4 lines to recolor the
  // like (thumbs-up) and love (heart) icons everywhere at once, for
  // both their normal and "already clicked" states. (Mirrors the
  // --icon-*-color CSS variables in :root.)
  // ------------------------------------------------------------------
  const LIKE_ICON_COLOR        = '#ffffff';
  const LIKE_ICON_ACTIVE_COLOR = '#2ee88f';
  const LOVE_ICON_COLOR        = '#ff4d5e';
  const LOVE_ICON_ACTIVE_COLOR = '#ff2740';

  document.documentElement.style.setProperty('--icon-like-color', LIKE_ICON_COLOR);
  document.documentElement.style.setProperty('--icon-like-active-color', LIKE_ICON_ACTIVE_COLOR);
  document.documentElement.style.setProperty('--icon-love-color', LOVE_ICON_COLOR);
  document.documentElement.style.setProperty('--icon-love-active-color', LOVE_ICON_ACTIVE_COLOR);

  const feed = document.getElementById('feed');
  const fmt = n => n.toLocaleString('en-US');

  const iconEye = `<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const iconLike = `<span class="icon-like" aria-hidden="true"></span>`;
  const iconLove = `<span class="icon-love" aria-hidden="true"></span>`;
  const iconMute = `<svg class="icon-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><g class="wave"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></g></svg>`;
  const iconChevron = `<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>`;

  function sourceTags(src, webmSrc){
    let tags = `<source src="${src}" type="video/mp4">`;
    if(webmSrc) tags += `<source src="${webmSrc}" type="video/webm">`;
    return tags;
  }

  // ------------------------------------------------------------------
  // LIKE / LOVE persistence — same per-browser localStorage approach as
  // the desktop grid, so a visitor's engagement survives a refresh.
  // ------------------------------------------------------------------
  const ENGAGEMENT_KEY = 'pico-engagement';
  function slugify(str){
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }
  function loadEngagement(){
    try { return JSON.parse(localStorage.getItem(ENGAGEMENT_KEY)) || {}; }
    catch { return {}; }
  }
  function saveEngagement(state){
    try { localStorage.setItem(ENGAGEMENT_KEY, JSON.stringify(state)); }
    catch { /* storage unavailable (private browsing, etc.) — fail quietly */ }
  }
  const engagement = loadEngagement();

  // One shared "muted" preference across the whole feed — matches how
  // TikTok/Reels remember your sound choice as you swipe between clips.
  let globalMuted = true;

  // every marquee strip is driven by one shared loop below instead of
  // each having its own timer — see "TITLE MARQUEE — SCROLL-REACTIVE
  // ANIMATION" at the bottom of this script
  const marqueeTracks = [];
  function buildTitleMarquee(title){
    const wrap = document.createElement('div');
    wrap.className = 'title-marquee';
    wrap.setAttribute('aria-hidden', 'true'); // decorative repeat of the card's own aria-label
    const track = document.createElement('div');
    track.className = 'title-marquee-track';
    const unit = document.createElement('span');
    unit.textContent = `${title}  \u25CF  `.repeat(6); // repeated well past any viewport width
    const unitCopy = unit.cloneNode(true);
    track.appendChild(unit);
    track.appendChild(unitCopy);
    wrap.appendChild(track);
    return wrap;
  }

  videos.forEach((v, i) => {
    const item = document.createElement('div');
    const id = slugify(v.title) || `video-${i}`;
    const state = engagement[id] || { liked:false, loved:false };
    const likeCount = v.likes + (state.liked ? 1 : 0);
    const loveCount = v.loves + (state.loved ? 1 : 0);

    item.className = 'v-item paused';
    item.style.setProperty('--t1', v.tint1);
    item.style.setProperty('--t2', v.tint2);
    item.setAttribute('aria-label', v.title);

    // thumbnails are loaded straight from your media/ folder — same
    // as the video files — no embedded data involved
    const posterSrc = v.poster || '';

    item.innerHTML = `
      <div class="grad"></div>
      <div class="v-thumb">${posterSrc ? `<img src="${posterSrc}" alt="" loading="lazy">` : ''}</div>
      <video playsinline webkit-playsinline muted loop preload="metadata">${sourceTags(v.videoSrc, v.videoSrcWebm)}</video>
      <div class="play-btn"><svg viewBox="0 0 16 16"><path d="M2 1l13 7-13 7z"/></svg></div>
      <div class="burst-heart"></div>
      <div class="v-info">
        <div class="v-views">${iconEye}<span class="stat-num">${fmt(v.views)}</span></div>
      </div>
      <div class="v-actions">
        <button type="button" class="action-btn mute-btn muted" aria-label="Toggle sound">
          <span class="action-circle">${iconMute}</span>
        </button>
        <button type="button" class="action-btn like-btn${state.liked ? ' active' : ''}" aria-pressed="${state.liked}" aria-label="Like this video">
          <span class="action-circle">${iconLike}</span>
          <span class="stat-num">${fmt(likeCount)}</span>
        </button>
        <button type="button" class="action-btn love-btn${state.loved ? ' active' : ''}" aria-pressed="${state.loved}" aria-label="Love this video">
          <span class="action-circle">${iconLove}</span>
          <span class="stat-num">${fmt(loveCount)}</span>
        </button>
      </div>
    `;

    const video = item.querySelector('video');
    const thumbImg = item.querySelector('.v-thumb img');
    const burst = item.querySelector('.burst-heart');
    const muteBtn = item.querySelector('.mute-btn');

    video.muted = true; // required for autoplay everywhere; unmuted on first tap

    video.addEventListener('error', () => {
      console.warn(`"${v.title}" failed to load. Check that "${v.videoSrc}" exists relative to this HTML file.`);
    });

    // ---- tap = play/pause, fired synchronously inside the gesture ----
    // iOS Safari only allows video.play() to succeed when it's called
    // directly inside the click/touch handler; wrapping it in a
    // setTimeout (as you'd naturally do to "wait and see if a second
    // tap is coming") breaks that and the video silently refuses to
    // play. So every tap toggles play/pause immediately, full stop.
    // A quick second tap layers a "love" on top of that same toggle —
    // on a real double-tap the two toggles cancel out (play→pause→play),
    // which is imperceptible under the heart animation.
    let lastTapTs = 0;
    item.addEventListener('click', (e) => {
      if(e.target.closest('.v-actions')) return; // action rail handles its own clicks
      togglePlay();
      const now = Date.now();
      if(now - lastTapTs < 320){
        loveIt(true); // double tap always loves, never un-loves
        playHeartBurst();
      }
      lastTapTs = now;
    });

    function togglePlay(){
      if(video.paused){ safePlay(); } else { video.pause(); item.classList.add('paused'); }
    }
    function safePlay(){
      const p = video.play();
      if(p && p.catch) p.catch(err => console.warn(`Could not play "${v.title}": ${err.message}`));
      item.classList.remove('paused');
    }
    function playHeartBurst(){
      burst.classList.remove('play');
      void burst.offsetWidth; // restart the animation even on rapid double-taps
      burst.classList.add('play');
    }

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      globalMuted = !globalMuted;
      document.querySelectorAll('.v-item video').forEach(vd => vd.muted = globalMuted);
      document.querySelectorAll('.mute-btn').forEach(b => b.classList.toggle('muted', globalMuted));
    });

    // ---- like / love: one +1 per visitor, persisted per-browser ----
    function wireToggle(selector, key, baseCount, forceOnly){
      const btn = item.querySelector(selector);
      const numEl = btn.querySelector('.stat-num');
      function apply(isActive){
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
        numEl.textContent = fmt(baseCount + (isActive ? 1 : 0));
        const current = loadEngagement();
        current[id] = current[id] || {};
        current[id][key] = isActive;
        saveEngagement(current);
      }
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const next = forceOnly ? true : !btn.classList.contains('active');
        apply(next);
        if(key === 'loved' && next) playHeartBurst();
      });
      return apply;
    }
    wireToggle('.like-btn', 'liked', v.likes);
    const loveIt = wireToggle('.love-btn', 'loved', v.loves, true);

    // each card sits in its own row, alternating left/right like a
    // staggered gallery instead of stacking edge-to-edge
    const row = document.createElement('div');
    row.className = `v-row ${i % 2 === 0 ? 'align-left' : 'align-right'}`;
    row.appendChild(item);
    feed.appendChild(row);

    const marqueeEl = buildTitleMarquee(v.title);
    feed.appendChild(marqueeEl);
    const marqueeTrack = marqueeEl.querySelector('.title-marquee-track');
    const unitWidth = marqueeTrack.firstElementChild.getBoundingClientRect().width;
    marqueeTracks.push({ track: marqueeTrack, unitWidth, pos: -unitWidth });

    // ---- no more autoplay-on-scroll: videos only play on tap now.
    // We still pause a clip if the user scrolls it out of view, so
    // nothing keeps playing off-screen. ----
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(!entry.isIntersecting && !video.paused){
          video.pause();
          item.classList.add('paused');
        }
      });
    }, { threshold: [0, 0.5, 1] });
    observer.observe(item);
  });

  // ------------------------------------------------------------------
  // THUMBNAIL SCROLL PARALLAX — each card's thumbnail image drifts
  // smoothly downward/upward inside its frame as you scroll, instead
  // of sitting frozen while the card itself moves. The image is sized
  // to 130% of the card's height (see .v-thumb img) so this drift never
  // exposes empty edges. A tiny lerp (linear-interpolation) toward the
  // target offset every frame is what makes the motion feel smooth and
  // slightly trailing, rather than snapping straight to the scroll
  // position.
  // ------------------------------------------------------------------
  const PARALLAX_RANGE = 216; // max px the image drifts from center in either direction
  const PARALLAX_EASE  = 0.05; // 0–1, lower = smoother/slower catch-up

  const parallaxLayers = Array.from(document.querySelectorAll('.v-thumb img')).map(img => ({
    img,
    card: img.closest('.v-item'),
    current: 0,
    target: 0
  }));

  function updateParallaxTargets(){
    const vh = window.innerHeight || document.documentElement.clientHeight;
    parallaxLayers.forEach(layer => {
      const rect = layer.card.getBoundingClientRect();
      const cardCenter = rect.top + rect.height / 2;
      // -1 when the card center is far above the viewport center,
      // +1 when far below it — clamped so the drift has a hard limit.
      const progress = Math.max(-1, Math.min(1, (cardCenter - vh / 2) / vh));
      layer.target = progress * PARALLAX_RANGE;
    });
  }

  function tickParallax(){
    parallaxLayers.forEach(layer => {
      layer.current += (layer.target - layer.current) * PARALLAX_EASE;
      layer.img.style.transform = `translateY(${layer.current.toFixed(2)}px)`;
    });
    requestAnimationFrame(tickParallax);
  }

  window.addEventListener('scroll', updateParallaxTargets, { passive: true });
  window.addEventListener('resize', updateParallaxTargets);
  updateParallaxTargets();
  requestAnimationFrame(tickParallax);

  // ------------------------------------------------------------------
  // TITLE MARQUEE — SCROLL-REACTIVE ANIMATION
  // Every strip drifts left-to-right on its own at a slow constant
  // pace. Scrolling adds a temporary "boost" on top of that pace, and
  // the DIRECTION of the boost depends on which way you scroll:
  //   scrolling DOWN -> boost pushes the same way as the resting drift
  //                      (left-to-right), so it just speeds up
  //   scrolling UP   -> boost pushes the opposite way (right-to-left),
  //                      a visible counter-movement against the resting drift
  // Either way, it eases back down to the plain resting drift once you
  // stop scrolling.
  //
  // Each track holds the title repeated twice back-to-back (built in
  // buildTitleMarquee above). Sliding that pair back and forth and
  // wrapping the position by exactly one unit width in whichever
  // direction it crosses is what makes the loop seamless in BOTH
  // directions — the two copies line up pixel for pixel at every
  // wrap point, so the snap is invisible either way.
  // ------------------------------------------------------------------
  const MARQUEE_BASE_SPEED = 0.028;   // px/ms at rest (~28px per second), always left-to-right
  const MARQUEE_BOOST_GAIN = 0.6;     // how strongly a scroll delta adds to the boost
  const MARQUEE_MAX_BOOST  = 1.4;     // px/ms — caps how fast a big, fast scroll can push it
  const MARQUEE_DECAY      = 0.94;    // per-frame easing back down to resting speed

  // ---- MASTER CONTROL: which way each scroll direction pushes the title ----
  // 1  = pushes left-to-right (same way as the resting drift, just faster)
  // -1 = pushes right-to-left (counter-movement against the resting drift)
  const MARQUEE_DOWN_DIRECTION = 1;   // scrolling the page DOWN
  const MARQUEE_UP_DIRECTION   = -1;  // scrolling the page UP

  let marqueeBoost = 0;
  let lastScrollY = window.scrollY;

  window.addEventListener('scroll', () => {
    const currentY = window.scrollY;
    const dy = currentY - lastScrollY;
    lastScrollY = currentY;
    if(dy === 0) return;

    const dir = dy > 0 ? MARQUEE_DOWN_DIRECTION : MARQUEE_UP_DIRECTION;
    const added = Math.abs(dy) * MARQUEE_BOOST_GAIN;
    // if the scroll direction just flipped, start the boost fresh in the
    // new direction instead of cancelling it out against the old one
    const carriedMagnitude = Math.sign(marqueeBoost) === dir || marqueeBoost === 0
      ? Math.abs(marqueeBoost)
      : 0;
    marqueeBoost = dir * Math.min(MARQUEE_MAX_BOOST, carriedMagnitude + added);
  }, { passive: true });

  window.addEventListener('resize', () => {
    marqueeTracks.forEach(t => {
      t.unitWidth = t.track.firstElementChild.getBoundingClientRect().width;
    });
  });

  let lastMarqueeT = performance.now();
  function tickMarquee(now){
    const dt = Math.min(now - lastMarqueeT, 50); // clamp so a backgrounded tab doesn't jump on return
    lastMarqueeT = now;
    const speed = MARQUEE_BASE_SPEED + marqueeBoost; // can go negative -> visible counter-movement
    marqueeBoost *= MARQUEE_DECAY;
    marqueeTracks.forEach(t => {
      t.pos += speed * dt;
      if(t.pos >= 0) t.pos -= t.unitWidth;
      else if(t.pos <= -t.unitWidth) t.pos += t.unitWidth;
      t.track.style.transform = `translateX(${t.pos.toFixed(2)}px)`;
    });
    requestAnimationFrame(tickMarquee);
  }
  requestAnimationFrame(tickMarquee);
</script>
